<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Binding of Epic</title>
<style>
  html,body{margin:0;height:100%;background:#120c0a;}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:monospace;color:#e8d8c0;overflow:hidden}
  canvas{background:#000;width:min(96vw, calc(88vh * 1.6667), 1500px);height:auto;aspect-ratio:960/576;border:4px solid #1a100a;box-shadow:0 0 60px #000}
  #info{margin-top:8px;font-size:14px;opacity:.75;text-align:center}
  /* ---- controles táctiles (celular) ---- */
  #touch{display:none}
  body.touch{justify-content:center;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  body.touch canvas{width:min(100vw, calc(100dvh * 1.6667));border:0;box-shadow:none}
  body.touch #info{display:none}
  body.touch #touch{display:block}
  .stick{position:fixed;bottom:max(14px, env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;
    background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);touch-action:none;z-index:10}
  #stickL{left:max(14px, env(safe-area-inset-left))}
  #stickR{right:max(14px, env(safe-area-inset-right))}
  .knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;
    background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.5);pointer-events:none}
  #stickR .knob{background:rgba(255,120,120,.4)}
  .stick span{position:absolute;left:0;right:0;top:-20px;text-align:center;font-size:11px;opacity:.6;pointer-events:none}
  #tbtns{position:fixed;top:max(8px, env(safe-area-inset-top));right:max(8px, env(safe-area-inset-right));display:flex;gap:8px;z-index:10}
  #tbtns button{width:42px;height:42px;border-radius:10px;border:2px solid rgba(255,255,255,.3);background:rgba(0,0,0,.45);
    color:#e8d8c0;font-size:18px;touch-action:none;padding:0}
  #rotate{display:none;position:fixed;left:0;right:0;top:8px;text-align:center;font-size:13px;opacity:.7;z-index:9}
  @media (orientation:portrait){
    body.touch{justify-content:flex-start;padding-top:60px}
    body.touch #rotate{display:block}
    .stick{width:150px;height:150px}
  }
</style>
</head>
<body>
<canvas id="c" width="960" height="576"></canvas>
<div id="info">WASD: moverse · Flechas: disparar · P: pausa · M: silenciar · R: reiniciar</div>
<div id="touch">
  <div id="rotate">📱 Gira el celular para jugar mejor</div>
  <div class="stick" id="stickL"><span>MOVER</span><div class="knob"></div></div>
  <div class="stick" id="stickR"><span>DISPARAR</span><div class="knob"></div></div>
  <div id="tbtns">
    <button data-k="KeyP" aria-label="Pausa">⏸</button>
    <button data-k="KeyM" aria-label="Silenciar">🔊</button>
    <button data-k="KeyR" aria-label="Reiniciar">↻</button>
  </div>
</div>
<script>
const W = 960, H = 576, L = 64, R = 896, TOP = 64, BOT = 512, CX = 480, CY = 288;
// Render en alta resolución (pantallas retina / 4K)
const DPR = Math.min(2, Math.max(1, (typeof window !== 'undefined' && window.devicePixelRatio) || 1));
const cv = document.getElementById('c');
cv.width = W * DPR; cv.height = H * DPR;
const mainCtx = cv.getContext('2d');
let ctx = mainCtx; // se intercambia temporalmente para dibujar en lienzos auxiliares
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
  if (!e.repeat) onKey(e.code);
});
addEventListener('keyup', e => keys[e.code] = false);
addEventListener('pointerdown', () => initAudio()); // un clic también activa el sonido (para la música del menú)

// =====================================================================
// CONTROLES TÁCTILES (celular): joystick izq = mover, joystick der = disparar
// =====================================================================
const touchMove = { x: 0, y: 0 }; // movimiento analógico del joystick izquierdo
function enableTouch() {
  if (document.body.classList.contains('touch')) return;
  document.body.classList.add('touch');
}
if (matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window) enableTouch();
addEventListener('touchstart', enableTouch, { passive: true });
addEventListener('contextmenu', e => { if (document.body.classList.contains('touch')) e.preventDefault(); });

function setupStick(el, onMove) {
  const knob = el.querySelector('.knob');
  let id = null;
  const update = e => {
    const r = el.getBoundingClientRect(), max = r.width / 2;
    let dx = e.clientX - (r.left + max), dy = e.clientY - (r.top + max);
    const d = Math.hypot(dx, dy);
    if (d > max) { dx *= max / d; dy *= max / d; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    onMove(dx / max, dy / max);
  };
  const end = e => {
    if (e.pointerId !== id) return;
    id = null; knob.style.transform = ''; onMove(0, 0);
  };
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation(); initAudio();
    id = e.pointerId; el.setPointerCapture(id); update(e);
  });
  el.addEventListener('pointermove', e => { if (e.pointerId === id) update(e); });
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}
// en los menús el joystick izquierdo también sirve para elegir personaje
let stickMenuDir = 0;
// código secreto táctil: mover arriba, abajo, izquierda, derecha, arriba, derecha => minijuego retro
const STICK_CODE = 'UDLRUR';
let stickCode = '', stickCodeDir = '', stickCodeT = 0;
setupStick(document.getElementById('stickL'), (x, y) => {
  const dead = 0.2, m = Math.hypot(x, y);
  const cdir = m < 0.6 ? '' : Math.abs(x) > Math.abs(y) ? (x < 0 ? 'L' : 'R') : (y < 0 ? 'U' : 'D');
  if (cdir !== stickCodeDir) {
    stickCodeDir = cdir;
    if (cdir) {
      const now = performance.now();
      if (now - stickCodeT > 2000) stickCode = ''; // demasiado lento: empezar de nuevo
      stickCodeT = now;
      stickCode = (stickCode + cdir).slice(-STICK_CODE.length);
      if (stickCode === STICK_CODE) { stickCode = ''; startRetro(); }
    }
  }
  touchMove.x = m > dead ? x : 0; touchMove.y = m > dead ? y : 0;
  const dir = x < -0.5 ? -1 : x > 0.5 ? 1 : 0;
  if (dir !== stickMenuDir) { stickMenuDir = dir; if (dir && state !== 'play') onKey(dir < 0 ? 'ArrowLeft' : 'ArrowRight'); }
});
// joystick derecho: dispara en la dirección dominante (como las flechas)
setupStick(document.getElementById('stickR'), (x, y) => {
  keys.ArrowUp = keys.ArrowDown = keys.ArrowLeft = keys.ArrowRight = false;
  if (Math.hypot(x, y) < 0.3) return;
  if (Math.abs(x) > Math.abs(y)) keys[x < 0 ? 'ArrowLeft' : 'ArrowRight'] = true;
  else keys[y < 0 ? 'ArrowUp' : 'ArrowDown'] = true;
});
for (const b of document.querySelectorAll('#tbtns button')) {
  b.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    onKey(b.dataset.k);
    if (b.dataset.k === 'KeyM') b.textContent = muted ? '🔇' : '🔊';
  });
}
// tocar la pantalla = Enter (menús, saltar escenas); en la selección: tocar a los lados cambia de personaje
cv.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse') return;
  e.preventDefault();
  if (state === 'menu' && !menuSub) {
    const r = cv.getBoundingClientRect(), fy = (e.clientY - r.top) / r.height * H;
    const i = MENU_ITEMS.findIndex((_, k) => Math.abs(fy - MENU_Y(k)) < 26);
    if (i >= 0) menuIdx = i;
  }
  if (state === 'select') {
    const r = cv.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width;
    if (fx < 0.3) { onKey('ArrowLeft'); return; }
    if (fx > 0.7) { onKey('ArrowRight'); return; }
  }
  onKey('Enter');
});

const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[ri(0, a.length - 1)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const lerp = (a, b, t) => a + (b - a) * t;
const DIRS = { T: [0, -1], B: [0, 1], L: [-1, 0], R: [1, 0] };
const key = (x, y) => x + ',' + y;

let state = 'title', paused = false, floorNum = 1, selIdx = 0, rooms, cur, p, floorBoss, winPending = false;
let tears = [], enemies = [], particles = [], hazards = [], spawnQ = [];
let bossIntro = null; // { t, boss } mientras se muestra la presentación del jefe
let artyT = 0, warAmbT = 300, warFlash = { a: 0, x: 0, y: 0 }; // artillería y explosiones lejanas
let msg = '', msgSub = '', msgT = 0, frame = 0, shake = 0;

// =====================================================================
// SONIDO (todo sintetizado con Web Audio)
// =====================================================================
let AC = null, master, sfxGain, musGain, noiseBuf, muted = false;
function initAudio() {
  if (AC) { if (AC.state === 'suspended' && !paused) AC.resume(); return; }
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  AC = new Ctx();
  master = AC.createGain(); master.gain.value = 0.6; master.connect(AC.destination);
  sfxGain = AC.createGain(); sfxGain.gain.value = 0.8; sfxGain.connect(master);
  musGain = AC.createGain(); musGain.gain.value = 0.3; musGain.connect(master);
  noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function tone({ f = 440, f2 = null, type = 'square', dur = 0.1, vol = 0.3, delay = 0, out = sfxGain, at = null }) {
  if (!AC) return;
  const t = (at !== null ? at : AC.currentTime) + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + 0.02);
}
function noise({ dur = 0.2, vol = 0.3, freq = 1000, f2 = null, type = 'lowpass', q = 1, delay = 0, out = sfxGain, at = null }) {
  if (!AC) return;
  const t = (at !== null ? at : AC.currentTime) + delay;
  const s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; fl.type = type; fl.Q.value = q;
  fl.frequency.setValueAtTime(freq, t);
  if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(fl); fl.connect(g); g.connect(out); s.start(t); s.stop(t + dur + 0.02);
}
const SFX = {
  knock() { noise({ dur: 0.08, vol: 0.55, freq: 320 }); tone({ f: 120, f2: 70, type: 'sine', dur: 0.09, vol: 0.45 }); },
  heartbeat() { tone({ f: 62, f2: 45, type: 'sine', dur: 0.14, vol: 0.5 }); tone({ f: 58, f2: 42, type: 'sine', dur: 0.12, vol: 0.38, delay: 0.2 }); },
  thud() { noise({ dur: 0.25, vol: 0.4, freq: 260 }); tone({ f: 85, f2: 40, type: 'sine', dur: 0.28, vol: 0.35 }); },
  sitDown() { noise({ dur: 0.2, vol: 0.2, freq: 400 }); tone({ f: 330, f2: 180, type: 'triangle', dur: 0.4, vol: 0.06 }); },
  chirp() { tone({ f: 2600, f2: 3500, type: 'sine', dur: 0.07, vol: 0.05 }); tone({ f: 3100, f2: 2500, type: 'sine', dur: 0.08, vol: 0.045, delay: 0.1 }); tone({ f: 2800, f2: 3600, type: 'sine', dur: 0.06, vol: 0.04, delay: 0.22 }); },
  drone() { tone({ f: 55, f2: 41, type: 'sine', dur: 4, vol: 0.28 }); tone({ f: 82, f2: 61, type: 'triangle', dur: 4, vol: 0.07 }); noise({ dur: 4, vol: 0.06, freq: 200, f2: 60 }); },
  glitch() { noise({ dur: 0.14, vol: 0.22, freq: 4000, type: 'bandpass', q: 3 }); tone({ f: 1400, f2: 200, type: 'square', dur: 0.1, vol: 0.06 }); },
  question() { tone({ f: 500, f2: 900, type: 'triangle', dur: 0.16, vol: 0.12 }); },
  surprise() { tone({ f: 700, f2: 1400, type: 'square', dur: 0.1, vol: 0.08 }); tone({ f: 1400, type: 'square', dur: 0.08, vol: 0.06, delay: 0.1 }); },
  blip() { tone({ f: 520 + Math.random() * 120, type: 'square', dur: 0.03, vol: 0.035 }); },
  blipLow() { tone({ f: 150 + Math.random() * 40, type: 'square', dur: 0.04, vol: 0.05 }); },
  clink() { tone({ f: 1500, f2: 1150, type: 'triangle', dur: 0.25, vol: 0.16 }); tone({ f: 2250, type: 'triangle', dur: 0.15, vol: 0.08, delay: 0.02 }); },
  engine() { tone({ f: 42, f2: 58, type: 'sawtooth', dur: 2.6, vol: 0.12 }); noise({ dur: 2.6, vol: 0.12, freq: 220, f2: 90 }); },
  vsSlam() { noise({ dur: 0.5, vol: 0.45, freq: 900, f2: 60 }); tone({ f: 120, f2: 35, type: 'sine', dur: 0.6, vol: 0.5 }); tone({ f: 240, f2: 70, type: 'square', dur: 0.18, vol: 0.12 }); },
  swoosh() { noise({ dur: 0.3, vol: 0.18, freq: 600, f2: 3500, type: 'bandpass', q: 1.5 }); },
  stamp() { noise({ dur: 0.12, vol: 0.4, freq: 500 }); tone({ f: 90, f2: 50, type: 'square', dur: 0.12, vol: 0.2 }); },
  whistle() { tone({ f: 1900, f2: 520, type: 'sine', dur: 1.1, vol: 0.09 }); tone({ f: 1940, f2: 540, type: 'sine', dur: 1.1, vol: 0.05 }); },
  rumble() { noise({ dur: 1.4, vol: 0.32, freq: 160, f2: 40 }); tone({ f: 55, f2: 30, type: 'sine', dur: 1.0, vol: 0.22 }); },
  shoot() { tone({ f: 560, f2: 240, type: 'sine', dur: 0.13, vol: 0.28 }); noise({ dur: 0.05, vol: 0.06, freq: 3000 }); },
  fire() { noise({ dur: 0.18, vol: 0.25, freq: 2500, f2: 300 }); tone({ f: 300, f2: 120, type: 'sawtooth', dur: 0.12, vol: 0.1 }); },
  sword() { noise({ dur: 0.15, vol: 0.2, freq: 1500, f2: 6000, type: 'bandpass', q: 4 }); tone({ f: 900, f2: 1800, type: 'triangle', dur: 0.12, vol: 0.12 }); },
  ringS() { tone({ f: 1320, type: 'sine', dur: 0.08, vol: 0.18 }); tone({ f: 1760, type: 'sine', dur: 0.12, vol: 0.15, delay: 0.04 }); },
  block() { tone({ f: 220, f2: 140, type: 'square', dur: 0.08, vol: 0.18 }); noise({ dur: 0.06, vol: 0.12, freq: 800 }); },
  laser() { tone({ f: 1400, f2: 250, type: 'square', dur: 0.14, vol: 0.13 }); },
  splash() { noise({ dur: 0.09, vol: 0.1, freq: 1800, f2: 300 }); },
  hit() { tone({ f: 190, f2: 90, type: 'square', dur: 0.07, vol: 0.14 }); },
  kill() { noise({ dur: 0.32, vol: 0.35, freq: 900, f2: 100 }); tone({ f: 230, f2: 50, type: 'sawtooth', dur: 0.28, vol: 0.18 }); },
  hurt() {
    tone({ f: 320, f2: 110, type: 'sawtooth', dur: 0.28, vol: 0.32 });
    tone({ f: 250, f2: 80, type: 'square', dur: 0.32, vol: 0.2, delay: 0.03 });
    noise({ dur: 0.15, vol: 0.22, freq: 1400 });
  },
  enemyShot() { tone({ f: 180, f2: 420, type: 'triangle', dur: 0.12, vol: 0.13 }); },
  arrow() { noise({ dur: 0.1, vol: 0.2, freq: 4000, f2: 1500, type: 'bandpass', q: 3 }); },
  orb() { tone({ f: 320, f2: 140, type: 'triangle', dur: 0.25, vol: 0.18 }); },
  hiss() { noise({ dur: 0.9, vol: 0.25, freq: 3500, f2: 6000, type: 'bandpass', q: 2 }); },
  boom() { noise({ dur: 0.8, vol: 0.6, freq: 1500, f2: 50 }); tone({ f: 110, f2: 25, type: 'sine', dur: 0.7, vol: 0.7 }); },
  squish() { tone({ f: 250, f2: 500, type: 'sine', dur: 0.12, vol: 0.18 }); },
  ghost() { tone({ f: 500, f2: 300, type: 'sine', dur: 0.4, vol: 0.12 }); tone({ f: 520, f2: 280, type: 'sine', dur: 0.4, vol: 0.1 }); },
  teleport() { tone({ f: 200, f2: 1600, type: 'sine', dur: 0.35, vol: 0.2 }); },
  summon() { [659, 587, 523, 440].forEach((f, i) => tone({ f, type: 'triangle', dur: 0.12, vol: 0.15, delay: i * 0.06 })); },
  slash() { noise({ dur: 0.12, vol: 0.3, freq: 5000, f2: 1200, type: 'bandpass', q: 2 }); tone({ f: 900, f2: 300, type: 'triangle', dur: 0.08, vol: 0.08 }); },
  parry() { tone({ f: 1800, f2: 1400, type: 'square', dur: 0.05, vol: 0.08 }); },
  throw() { noise({ dur: 0.15, vol: 0.18, freq: 800, f2: 2500, type: 'bandpass', q: 2 }); tone({ f: 300, f2: 500, type: 'triangle', dur: 0.1, vol: 0.12 }); },
  sniper() { noise({ dur: 0.35, vol: 0.5, freq: 3000, f2: 200 }); tone({ f: 180, f2: 40, type: 'sawtooth', dur: 0.25, vol: 0.3 }); },
  flame() { noise({ dur: 0.18, vol: 0.14, freq: 600, f2: 1400, type: 'bandpass', q: 1 }); },
  bump() { tone({ f: 150, f2: 90, type: 'square', dur: 0.06, vol: 0.18 }); },
  drop() { tone({ f: 900, f2: 200, type: 'sine', dur: 0.3, vol: 0.15 }); },
  select() { tone({ f: 660, type: 'square', dur: 0.06, vol: 0.12 }); tone({ f: 880, type: 'square', dur: 0.06, vol: 0.12, delay: 0.05 }); },
  doorClose() { tone({ f: 90, f2: 45, type: 'square', dur: 0.25, vol: 0.25 }); noise({ dur: 0.25, vol: 0.3, freq: 500, f2: 80 }); },
  doorOpen() {
    noise({ dur: 0.3, vol: 0.2, freq: 300, f2: 1200, type: 'bandpass', q: 2 });
    tone({ f: 330, type: 'triangle', dur: 0.15, vol: 0.2, delay: 0.05 });
    tone({ f: 494, type: 'triangle', dur: 0.25, vol: 0.2, delay: 0.15 });
  },
  heart() { tone({ f: 660, type: 'sine', dur: 0.1, vol: 0.28 }); tone({ f: 990, type: 'sine', dur: 0.18, vol: 0.28, delay: 0.08 }); },
  item() {
    [523, 659, 784, 1047].forEach((f, i) => tone({ f, type: 'triangle', dur: 0.18, vol: 0.28, delay: i * 0.09 }));
    [523, 659, 784].forEach(f => tone({ f: f * 2, type: 'square', dur: 0.7, vol: 0.07, delay: 0.38 }));
    tone({ f: 1047, type: 'triangle', dur: 0.8, vol: 0.25, delay: 0.38 });
  },
  star() { for (let i = 0; i < 12; i++) tone({ f: [523, 659, 784, 1047][i % 4] * (1 + Math.floor(i / 4) * 0.5), type: 'square', dur: 0.08, vol: 0.1, delay: i * 0.05 }); },
  stomp() { tone({ f: 100, f2: 30, type: 'sine', dur: 0.4, vol: 0.6 }); noise({ dur: 0.3, vol: 0.35, freq: 500, f2: 60 }); },
  bigStomp() { tone({ f: 80, f2: 20, type: 'sine', dur: 0.7, vol: 0.8 }); noise({ dur: 0.6, vol: 0.5, freq: 700, f2: 40 }); },
  spit() { noise({ dur: 0.35, vol: 0.32, freq: 500, f2: 2500, type: 'bandpass', q: 3 }); tone({ f: 160, f2: 70, type: 'sawtooth', dur: 0.3, vol: 0.2 }); },
  jump() { tone({ f: 120, f2: 500, type: 'triangle', dur: 0.4, vol: 0.25 }); },
  roar() {
    tone({ f: 95, f2: 55, type: 'sawtooth', dur: 1.0, vol: 0.35 });
    tone({ f: 100, f2: 58, type: 'sawtooth', dur: 1.0, vol: 0.25 });
    noise({ dur: 1.0, vol: 0.3, freq: 400, f2: 150, type: 'bandpass', q: 2 });
  },
  screech() { tone({ f: 900, f2: 400, type: 'sawtooth', dur: 0.6, vol: 0.2 }); noise({ dur: 0.6, vol: 0.2, freq: 3000, f2: 800, type: 'bandpass', q: 3 }); },
  brimstone() { tone({ f: 70, f2: 50, type: 'sawtooth', dur: 0.9, vol: 0.3 }); noise({ dur: 0.9, vol: 0.35, freq: 900, f2: 300, type: 'bandpass', q: 1 }); tone({ f: 420, f2: 380, type: 'square', dur: 0.6, vol: 0.06 }); },
  laugh() { [0, 1, 2, 3].forEach(i => tone({ f: 620 - i * 40, f2: 480 - i * 40, type: 'triangle', dur: 0.12, vol: 0.14, delay: i * 0.13 })); },
  bossDie() {

    for (let i = 0; i < 6; i++) noise({ dur: 0.35, vol: 0.4, freq: 1200 - i * 150, f2: 80, delay: i * 0.15 });
    tone({ f: 300, f2: 30, type: 'sawtooth', dur: 1.6, vol: 0.3 });
    [392, 494, 587, 784].forEach((f, i) => tone({ f, type: 'square', dur: 0.3, vol: 0.12, delay: 1.2 + i * 0.12 }));
  },
  death() {
    [392, 370, 349, 330, 262].forEach((f, i) => tone({ f, type: 'triangle', dur: i === 4 ? 1.2 : 0.35, vol: 0.3, delay: i * 0.3 }));
    noise({ dur: 0.4, vol: 0.3, freq: 800, f2: 100 });
  },
  win() {
    const m = [523, 523, 523, 659, 784, 0, 659, 784, 1047];
    m.forEach((f, i) => { if (f) tone({ f, type: 'square', dur: i === 8 ? 1.0 : 0.15, vol: 0.18, delay: i * 0.16 }); });
    [262, 330, 392].forEach(f => tone({ f, type: 'triangle', dur: 1.2, vol: 0.15, delay: 1.28 }));
  },
  retroOn() {

function hasDoor(d) { return !!neighbor(d); }
function movePlayer() {

    if (hasDoor('T') && p.vy < 0 && p.y < TOP + 60 && Math.abs(p.x - CX) < 44) nx += (CX - nx) * 0.25;
    if (hasDoor('B') && p.vy > 0 && p.y > BOT - 60 && Math.abs(p.x - CX) < 44) nx += (CX - nx) * 0.25;
    if (hasDoor('L') && p.vx < 0 && p.x < L + 60 && Math.abs(p.y - CY) < 44) ny += (CY - ny) * 0.25;
    if (hasDoor('R') && p.vx > 0 && p.x > R - 60 && Math.abs(p.y - CY) < 44) ny += (CY - ny) * 0.25;
  }
  let minX = L + p.r, maxX = R - p.r, minY = TOP + p.r, maxY = BOT - p.r;

  if (open && inV && hasDoor('T')) minY = -40;
  if (open && inV && hasDoor('B')) maxY = H + 40;
  if (open && inH && hasDoor('L')) minX = -40;
  if (open && inH && hasDoor('R')) maxX = W + 40;
  if (p.y < TOP + p.r - 1 || p.y > BOT - p.r + 1) nx = clamp(nx, CX - 16, CX + 16);
  if (p.x < L + p.r - 1 || p.x > R - p.r + 1) ny = clamp(ny, CY - 16, CY + 16);

  else if (p.y > BOT + 24) goRoom(0, 1);
  else if (p.x < L - 24) goRoom(-1, 0);
  else if (p.x > R + 24) goRoom(1, 0);
}
function goRoom(dx, dy) {

  if (dy === 1) { p.x = CX; p.y = TOP + p.r + 6; }

  rec.ondataavailable = e => parts.push(e.data);
  rec.start(); await wait(300);
  p.inv = 0; p.shield = 0; p.star = 0; hurt(p.hp); // golpe final
  while (deathCut) await wait(50);
  await wait(2500); // un rato de la pantalla HAS MUERTO
  rec.stop(); await done; master.disconnect(audio);
  const buf = new Uint8Array(await new Blob(parts).arrayBuffer());
  let s = '';
  for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  return btoa(s);
};

let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>

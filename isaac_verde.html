<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Binding of Epic</title>
<style>
  html,body{margin:0;height:100%;background:#120c0a;}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:monospace;color:#e8d8c0;overflow:hidden}
  canvas{background:#000;width:min(96vw, calc(88vh * 1.6667), 1500px);height:auto;aspect-ratio:960/576;border:4px solid #1a100a;box-shadow:0 0 60px #000}
  #info{margin-top:8px;font-size:14px;opacity:.75;text-align:center}
  /* ---- controles táctiles (celular) ---- */
  #touch{display:none}
  body.touch{justify-content:center;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  body.touch canvas{width:min(100vw, calc(100dvh * 1.6667));border:0;box-shadow:none}
  body.touch #info{display:none}
  body.touch #touch{display:block}
  .stick{position:fixed;bottom:max(14px, env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;
    background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);touch-action:none;z-index:10}
  #stickL{left:max(14px, env(safe-area-inset-left))}
  #stickR{right:max(14px, env(safe-area-inset-right))}
  .knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;
    background:rgba(255,255,255,.35);border:2px solid rgba(255,255,255,.5);pointer-events:none}
  #stickR .knob{background:rgba(255,120,120,.4)}
  .stick span{position:absolute;left:0;right:0;top:-20px;text-align:center;font-size:11px;opacity:.6;pointer-events:none}
  #tbtns{position:fixed;top:max(8px, env(safe-area-inset-top));right:max(8px, env(safe-area-inset-right));display:flex;gap:8px;z-index:10}
  #tbtns button{width:42px;height:42px;border-radius:10px;border:2px solid rgba(255,255,255,.3);background:rgba(0,0,0,.45);
    color:#e8d8c0;font-size:18px;touch-action:none;padding:0}
  #rotate{display:none;position:fixed;left:0;right:0;top:8px;text-align:center;font-size:13px;opacity:.7;z-index:9}
  @media (orientation:portrait){
    body.touch{justify-content:flex-start;padding-top:60px}
    body.touch #rotate{display:block}
    .stick{width:150px;height:150px}
  }
</style>
</head>
<body>
<canvas id="c" width="960" height="576"></canvas>
<div id="info">WASD: moverse · Flechas: disparar · P: pausa · M: silenciar · R: reiniciar</div>
<div id="touch">
  <div id="rotate">📱 Gira el celular para jugar mejor</div>
  <div class="stick" id="stickL"><span>MOVER</span><div class="knob"></div></div>
  <div class="stick" id="stickR"><span>DISPARAR</span><div class="knob"></div></div>
  <div id="tbtns">
    <button data-k="KeyP" aria-label="Pausa">⏸</button>
    <button data-k="KeyM" aria-label="Silenciar">🔊</button>
    <button data-k="KeyR" aria-label="Reiniciar">↻</button>
  </div>
</div>
<script>
const W = 960, H = 576, L = 64, R = 896, TOP = 64, BOT = 512, CX = 480, CY = 288;
// Render en alta resolución (pantallas retina / 4K)
const DPR = Math.min(2, Math.max(1, (typeof window !== 'undefined' && window.devicePixelRatio) || 1));
const cv = document.getElementById('c');
cv.width = W * DPR; cv.height = H * DPR;
const mainCtx = cv.getContext('2d');
let ctx = mainCtx; // se intercambia temporalmente para dibujar en lienzos auxiliares
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
  if (!e.repeat) onKey(e.code);
});
addEventListener('keyup', e => keys[e.code] = false);
addEventListener('pointerdown', () => initAudio()); // un clic también activa el sonido (para la música del menú)

// =====================================================================
// CONTROLES TÁCTILES (celular): joystick izq = mover, joystick der = disparar
// =====================================================================
const touchMove = { x: 0, y: 0 }; // movimiento analógico del joystick izquierdo
function enableTouch() {
  if (document.body.classList.contains('touch')) return;
  document.body.classList.add('touch');
}
if (matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window) enableTouch();
addEventListener('touchstart', enableTouch, { passive: true });
addEventListener('contextmenu', e => { if (document.body.classList.contains('touch')) e.preventDefault(); });

function setupStick(el, onMove) {
  const knob = el.querySelector('.knob');
  let id = null;
  const update = e => {
    const r = el.getBoundingClientRect(), max = r.width / 2;
    let dx = e.clientX - (r.left + max), dy = e.clientY - (r.top + max);
    const d = Math.hypot(dx, dy);
    if (d > max) { dx *= max / d; dy *= max / d; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    onMove(dx / max, dy / max);
  };
  const end = e => {
    if (e.pointerId !== id) return;
    id = null; knob.style.transform = ''; onMove(0, 0);
  };
  el.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation(); initAudio();
    id = e.pointerId; el.setPointerCapture(id); update(e);
  });
  el.addEventListener('pointermove', e => { if (e.pointerId === id) update(e); });
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}
// en los menús el joystick izquierdo también sirve para elegir personaje
let stickMenuDir = 0, stickMenuV = 0;
// código secreto táctil: mover arriba, abajo, izquierda, derecha, arriba, derecha => minijuego retro
const STICK_CODE = 'UDLRUR';
let stickCode = '', stickCodeDir = '', stickCodeT = 0;
setupStick(document.getElementById('stickL'), (x, y) => {
  const dead = 0.2, m = Math.hypot(x, y);
  const cdir = m < 0.6 ? '' : Math.abs(x) > Math.abs(y) ? (x < 0 ? 'L' : 'R') : (y < 0 ? 'U' : 'D');
  if (cdir !== stickCodeDir) {
    stickCodeDir = cdir;
    if (cdir) {
      const now = performance.now();
      if (now - stickCodeT > 2000) stickCode = ''; // demasiado lento: empezar de nuevo
      stickCodeT = now;
      stickCode = (stickCode + cdir).slice(-STICK_CODE.length);
      if (stickCode === STICK_CODE) { stickCode = ''; startRetro(); }
    }
  }
  touchMove.x = m > dead ? x : 0; touchMove.y = m > dead ? y : 0;
  const dir = x < -0.5 ? -1 : x > 0.5 ? 1 : 0;
  if (dir !== stickMenuDir) { stickMenuDir = dir; if (dir && (state !== 'play' || ut || bal)) onKey(dir < 0 ? 'ArrowLeft' : 'ArrowRight'); }
  const vdir = y < -0.5 ? -1 : y > 0.5 ? 1 : 0; // en la batalla de Sans también para las listas
  if (vdir !== stickMenuV) { stickMenuV = vdir; if (vdir && (ut || bal)) onKey(vdir < 0 ? 'ArrowUp' : 'ArrowDown'); }
});
// joystick derecho: dispara en la dirección dominante (como las flechas)
setupStick(document.getElementById('stickR'), (x, y) => {
  keys.ArrowUp = keys.ArrowDown = keys.ArrowLeft = keys.ArrowRight = false;
  if (Math.hypot(x, y) < 0.3) return;
  if (Math.abs(x) > Math.abs(y)) keys[x < 0 ? 'ArrowLeft' : 'ArrowRight'] = true;
  else keys[y < 0 ? 'ArrowUp' : 'ArrowDown'] = true;
});
for (const b of document.querySelectorAll('#tbtns button')) {
  b.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    onKey(b.dataset.k);
    if (b.dataset.k === 'KeyM') b.textContent = muted ? '🔇' : '🔊';
  });
}
// tocar la pantalla = Enter (menús, saltar escenas); en la selección: tocar a los lados cambia de personaje
cv.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse') return;
  e.preventDefault();
  if (state === 'menu' && !menuSub) {
    const r = cv.getBoundingClientRect(), fy = (e.clientY - r.top) / r.height * H;
    const i = MENU_ITEMS.findIndex((_, k) => Math.abs(fy - MENU_Y(k)) < 26);
    if (i >= 0) menuIdx = i;
  }
  if (state === 'select') {
    const r = cv.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width;
    if (fx < 0.3) { onKey('ArrowLeft'); return; }
    if (fx > 0.7) { onKey('ArrowRight'); return; }
  }
  onKey('Enter');
});

const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[ri(0, a.length - 1)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const lerp = (a, b, t) => a + (b - a) * t;
const DIRS = { T: [0, -1], B: [0, 1], L: [-1, 0], R: [1, 0] };
const key = (x, y) => x + ',' + y;

let state = 'title', paused = false, floorNum = 1, selIdx = 0, rooms, cur, p, floorBoss, winPending = false;
let tears = [], enemies = [], particles = [], hazards = [], spawnQ = [];
let bossIntro = null; // { t, boss } mientras se muestra la presentación del jefe
let artyT = 0, warAmbT = 300, warFlash = { a: 0, x: 0, y: 0 }; // artillería y explosiones lejanas
let msg = '', msgSub = '', msgT = 0, frame = 0, shake = 0;

// =====================================================================
// SONIDO (todo sintetizado con Web Audio)
// =====================================================================
let AC = null, master, sfxGain, musGain, noiseBuf, muted = false;
function initAudio() {
  if (AC) { if (AC.state === 'suspended' && !paused) AC.resume(); return; }
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  AC = new Ctx();
  master = AC.createGain(); master.gain.value = 0.6; master.connect(AC.destination);
  sfxGain = AC.createGain(); sfxGain.gain.value = 0.8; sfxGain.connect(master);
  musGain = AC.createGain(); musGain.gain.value = 0.3; musGain.connect(master);
  noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function tone({ f = 440, f2 = null, type = 'square', dur = 0.1, vol = 0.3, delay = 0, out = sfxGain, at = null }) {
  if (!AC) return;
  const t = (at !== null ? at : AC.currentTime) + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + 0.02);
}
function noise({ dur = 0.2, vol = 0.3, freq = 1000, f2 = null, type = 'lowpass', q = 1, delay = 0, out = sfxGain, at = null }) {
  if (!AC) return;
  const t = (at !== null ? at : AC.currentTime) + delay;
  const s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; fl.type = type; fl.Q.value = q;
  fl.frequency.setValueAtTime(freq, t);
  if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(fl); fl.connect(g); g.connect(out); s.start(t); s.stop(t + dur + 0.02);
}
const SFX = {
  knock() { noise({ dur: 0.08, vol: 0.55, freq: 320 }); tone({ f: 120, f2: 70, type: 'sine', dur: 0.09, vol: 0.45 }); },
  heartbeat() { tone({ f: 62, f2: 45, type: 'sine', dur: 0.14, vol: 0.5 }); tone({ f: 58, f2: 42, type: 'sine', dur: 0.12, vol: 0.38, delay: 0.2 }); },
  thud() { noise({ dur: 0.25, vol: 0.4, freq: 260 }); tone({ f: 85, f2: 40, type: 'sine', dur: 0.28, vol: 0.35 }); },
  sitDown() { noise({ dur: 0.2, vol: 0.2, freq: 400 }); tone({ f: 330, f2: 180, type: 'triangle', dur: 0.4, vol: 0.06 }); },
  chirp() { tone({ f: 2600, f2: 3500, type: 'sine', dur: 0.07, vol: 0.05 }); tone({ f: 3100, f2: 2500, type: 'sine', dur: 0.08, vol: 0.045, delay: 0.1 }); tone({ f: 2800, f2: 3600, type: 'sine', dur: 0.06, vol: 0.04, delay: 0.22 }); },
  drone() { tone({ f: 55, f2: 41, type: 'sine', dur: 4, vol: 0.28 }); tone({ f: 82, f2: 61, type: 'triangle', dur: 4, vol: 0.07 }); noise({ dur: 4, vol: 0.06, freq: 200, f2: 60 }); },
  glitch() { noise({ dur: 0.14, vol: 0.22, freq: 4000, type: 'bandpass', q: 3 }); tone({ f: 1400, f2: 200, type: 'square', dur: 0.1, vol: 0.06 }); },
  question() { tone({ f: 500, f2: 900, type: 'triangle', dur: 0.16, vol: 0.12 }); },
  surprise() { tone({ f: 700, f2: 1400, type: 'square', dur: 0.1, vol: 0.08 }); tone({ f: 1400, type: 'square', dur: 0.08, vol: 0.06, delay: 0.1 }); },
  blip() { tone({ f: 520 + Math.random() * 120, type: 'square', dur: 0.03, vol: 0.035 }); },
  blipLow() { tone({ f: 150 + Math.random() * 40, type: 'square', dur: 0.04, vol: 0.05 }); },
  clink() { tone({ f: 1500, f2: 1150, type: 'triangle', dur: 0.25, vol: 0.16 }); tone({ f: 2250, type: 'triangle', dur: 0.15, vol: 0.08, delay: 0.02 }); },
  engine() { tone({ f: 42, f2: 58, type: 'sawtooth', dur: 2.6, vol: 0.12 }); noise({ dur: 2.6, vol: 0.12, freq: 220, f2: 90 }); },
  vsSlam() { noise({ dur: 0.5, vol: 0.45, freq: 900, f2: 60 }); tone({ f: 120, f2: 35, type: 'sine', dur: 0.6, vol: 0.5 }); tone({ f: 240, f2: 70, type: 'square', dur: 0.18, vol: 0.12 }); },
  swoosh() { noise({ dur: 0.3, vol: 0.18, freq: 600, f2: 3500, type: 'bandpass', q: 1.5 }); },
  stamp() { noise({ dur: 0.12, vol: 0.4, freq: 500 }); tone({ f: 90, f2: 50, type: 'square', dur: 0.12, vol: 0.2 }); },
  whistle() { tone({ f: 1900, f2: 520, type: 'sine', dur: 1.1, vol: 0.09 }); tone({ f: 1940, f2: 540, type: 'sine', dur: 1.1, vol: 0.05 }); },
  rumble() { noise({ dur: 1.4, vol: 0.32, freq: 160, f2: 40 }); tone({ f: 55, f2: 30, type: 'sine', dur: 1.0, vol: 0.22 }); },
  shoot() { tone({ f: 560, f2: 240, type: 'sine', dur: 0.13, vol: 0.28 }); noise({ dur: 0.05, vol: 0.06, freq: 3000 }); },
  fire() { noise({ dur: 0.18, vol: 0.25, freq: 2500, f2: 300 }); tone({ f: 300, f2: 120, type: 'sawtooth', dur: 0.12, vol: 0.1 }); },
  sword() { noise({ dur: 0.15, vol: 0.2, freq: 1500, f2: 6000, type: 'bandpass', q: 4 }); tone({ f: 900, f2: 1800, type: 'triangle', dur: 0.12, vol: 0.12 }); },
  ringS() { tone({ f: 1320, type: 'sine', dur: 0.08, vol: 0.18 }); tone({ f: 1760, type: 'sine', dur: 0.12, vol: 0.15, delay: 0.04 }); },
  block() { tone({ f: 220, f2: 140, type: 'square', dur: 0.08, vol: 0.18 }); noise({ dur: 0.06, vol: 0.12, freq: 800 }); },
  laser() { tone({ f: 1400, f2: 250, type: 'square', dur: 0.14, vol: 0.13 }); },
  splash() { noise({ dur: 0.09, vol: 0.1, freq: 1800, f2: 300 }); },
  hit() { tone({ f: 190, f2: 90, type: 'square', dur: 0.07, vol: 0.14 }); },
  kill() { noise({ dur: 0.32, vol: 0.35, freq: 900, f2: 100 }); tone({ f: 230, f2: 50, type: 'sawtooth', dur: 0.28, vol: 0.18 }); },
  hurt() {
    tone({ f: 320, f2: 110, type: 'sawtooth', dur: 0.28, vol: 0.32 });
    tone({ f: 250, f2: 80, type: 'square', dur: 0.32, vol: 0.2, delay: 0.03 });
    noise({ dur: 0.15, vol: 0.22, freq: 1400 });
  },
  enemyShot() { tone({ f: 180, f2: 420, type: 'triangle', dur: 0.12, vol: 0.13 }); },
  arrow() { noise({ dur: 0.1, vol: 0.2, freq: 4000, f2: 1500, type: 'bandpass', q: 3 }); },
  orb() { tone({ f: 320, f2: 140, type: 'triangle', dur: 0.25, vol: 0.18 }); },
  hiss() { noise({ dur: 0.9, vol: 0.25, freq: 3500, f2: 6000, type: 'bandpass', q: 2 }); },
  boom() { noise({ dur: 0.8, vol: 0.6, freq: 1500, f2: 50 }); tone({ f: 110, f2: 25, type: 'sine', dur: 0.7, vol: 0.7 }); },
  squish() { tone({ f: 250, f2: 500, type: 'sine', dur: 0.12, vol: 0.18 }); },
  ghost() { tone({ f: 500, f2: 300, type: 'sine', dur: 0.4, vol: 0.12 }); tone({ f: 520, f2: 280, type: 'sine', dur: 0.4, vol: 0.1 }); },
  teleport() { tone({ f: 200, f2: 1600, type: 'sine', dur: 0.35, vol: 0.2 }); },
  summon() { [659, 587, 523, 440].forEach((f, i) => tone({ f, type: 'triangle', dur: 0.12, vol: 0.15, delay: i * 0.06 })); },
  slash() { noise({ dur: 0.12, vol: 0.3, freq: 5000, f2: 1200, type: 'bandpass', q: 2 }); tone({ f: 900, f2: 300, type: 'triangle', dur: 0.08, vol: 0.08 }); },
  parry() { tone({ f: 1800, f2: 1400, type: 'square', dur: 0.05, vol: 0.08 }); },
  throw() { noise({ dur: 0.15, vol: 0.18, freq: 800, f2: 2500, type: 'bandpass', q: 2 }); tone({ f: 300, f2: 500, type: 'triangle', dur: 0.1, vol: 0.12 }); },
  sniper() { noise({ dur: 0.35, vol: 0.5, freq: 3000, f2: 200 }); tone({ f: 180, f2: 40, type: 'sawtooth', dur: 0.25, vol: 0.3 }); },
  flame() { noise({ dur: 0.18, vol: 0.14, freq: 600, f2: 1400, type: 'bandpass', q: 1 }); },
  bump() { tone({ f: 150, f2: 90, type: 'square', dur: 0.06, vol: 0.18 }); },
  drop() { tone({ f: 900, f2: 200, type: 'sine', dur: 0.3, vol: 0.15 }); },
  select() { tone({ f: 660, type: 'square', dur: 0.06, vol: 0.12 }); tone({ f: 880, type: 'square', dur: 0.06, vol: 0.12, delay: 0.05 }); },
  doorClose() { tone({ f: 90, f2: 45, type: 'square', dur: 0.25, vol: 0.25 }); noise({ dur: 0.25, vol: 0.3, freq: 500, f2: 80 }); },
  doorOpen() {
    noise({ dur: 0.3, vol: 0.2, freq: 300, f2: 1200, type: 'bandpass', q: 2 });
    tone({ f: 330, type: 'triangle', dur: 0.15, vol: 0.2, delay: 0.05 });
    tone({ f: 494, type: 'triangle', dur: 0.25, vol: 0.2, delay: 0.15 });
  },
  heart() { tone({ f: 660, type: 'sine', dur: 0.1, vol: 0.28 }); tone({ f: 990, type: 'sine', dur: 0.18, vol: 0.28, delay: 0.08 }); },
  item() {
    [523, 659, 784, 1047].forEach((f, i) => tone({ f, type: 'triangle', dur: 0.18, vol: 0.28, delay: i * 0.09 }));
    [523, 659, 784].forEach(f => tone({ f: f * 2, type: 'square', dur: 0.7, vol: 0.07, delay: 0.38 }));
    tone({ f: 1047, type: 'triangle', dur: 0.8, vol: 0.25, delay: 0.38 });
  },
  star() { for (let i = 0; i < 12; i++) tone({ f: [523, 659, 784, 1047][i % 4] * (1 + Math.floor(i / 4) * 0.5), type: 'square', dur: 0.08, vol: 0.1, delay: i * 0.05 }); },
  stomp() { tone({ f: 100, f2: 30, type: 'sine', dur: 0.4, vol: 0.6 }); noise({ dur: 0.3, vol: 0.35, freq: 500, f2: 60 }); },
  bigStomp() { tone({ f: 80, f2: 20, type: 'sine', dur: 0.7, vol: 0.8 }); noise({ dur: 0.6, vol: 0.5, freq: 700, f2: 40 }); },
  spit() { noise({ dur: 0.35, vol: 0.32, freq: 500, f2: 2500, type: 'bandpass', q: 3 }); tone({ f: 160, f2: 70, type: 'sawtooth', dur: 0.3, vol: 0.2 }); },
  jump() { tone({ f: 120, f2: 500, type: 'triangle', dur: 0.4, vol: 0.25 }); },
  roar() {
    tone({ f: 95, f2: 55, type: 'sawtooth', dur: 1.0, vol: 0.35 });
    tone({ f: 100, f2: 58, type: 'sawtooth', dur: 1.0, vol: 0.25 });
    noise({ dur: 1.0, vol: 0.3, freq: 400, f2: 150, type: 'bandpass', q: 2 });
  },
  screech() { tone({ f: 900, f2: 400, type: 'sawtooth', dur: 0.6, vol: 0.2 }); noise({ dur: 0.6, vol: 0.2, freq: 3000, f2: 800, type: 'bandpass', q: 3 }); },
  brimstone() { tone({ f: 70, f2: 50, type: 'sawtooth', dur: 0.9, vol: 0.3 }); noise({ dur: 0.9, vol: 0.35, freq: 900, f2: 300, type: 'bandpass', q: 1 }); tone({ f: 420, f2: 380, type: 'square', dur: 0.6, vol: 0.06 }); },
  laugh() { [0, 1, 2, 3].forEach(i => tone({ f: 620 - i * 40, f2: 480 - i * 40, type: 'triangle', dur: 0.12, vol: 0.14, delay: i * 0.13 })); },
  bossDie() {

    for (let i = 0; i < 6; i++) noise({ dur: 0.35, vol: 0.4, freq: 1200 - i * 150, f2: 80, delay: i * 0.15 });
    tone({ f: 300, f2: 30, type: 'sawtooth', dur: 1.6, vol: 0.3 });
    [392, 494, 587, 784].forEach((f, i) => tone({ f, type: 'square', dur: 0.3, vol: 0.12, delay: 1.2 + i * 0.12 }));
  },
  death() {
    [392, 370, 349, 330, 262].forEach((f, i) => tone({ f, type: 'triangle', dur: i === 4 ? 1.2 : 0.35, vol: 0.3, delay: i * 0.3 }));
    noise({ dur: 0.4, vol: 0.3, freq: 800, f2: 100 });
  },
  win() {
    const m = [523, 523, 523, 659, 784, 0, 659, 784, 1047];
    m.forEach((f, i) => { if (f) tone({ f, type: 'square', dur: i === 8 ? 1.0 : 0.15, vol: 0.18, delay: i * 0.16 }); });
    [262, 330, 392].forEach(f => tone({ f, type: 'triangle', dur: 1.2, vol: 0.15, delay: 1.28 }));

const SCALES = {

    const deg = s.prog[bi % s.prog.length], root = s.key - 24 + semi(deg);

      const a = s.arp ? DEG.indexOf(s.arp[i % s.arp.length]) : -1; arp.push(a < 0 ? null : s.key + semi(deg + a));
      pad.push(i === 0 ? [root + 12, s.key - 12 + semi(deg + 2), s.key - 12 + semi(deg + 4)] : null);
      const d = dr[i % dr.length];
      drums.push((s.crash && bi % s.crash === 0 && i === 0 ? 'c' : '') + (d === '-' ? '' : d) || null);
    }
  });

}

function ell(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, Math.PI * 2); }

function baseBody(walk, legC, bodyC, armC, line) {
  const s = Math.sin(walk), up = v => Math.max(0, v);
  const side = bodyFace === 'L' || bodyFace === 'R', dir = bodyFace === 'L' ? -1 : 1;
  // cada parte es una bola con volumen (luz arriba a la izquierda); dk oscurece la que queda atrás
  const ball = (x, y, rx, ry, c, lw, dk = 0) => {
    ell(x, y, rx, ry); ctx.fillStyle = rad(x, y, Math.max(rx, ry), shade(c, 0.35 - dk), dk ? shade(c, -dk) : c, shade(c, -0.5 - dk * 0.4)); ctx.fill();
    ctx.strokeStyle = line; ctx.lineWidth = lw; ctx.stroke();

  softShadow(0, 17, 18, 6.5, 0.55);

    ball(-s * 5 * dir, 14 - up(-s) * 2.5, 4.2, 4.2, legC, 1.5, 0.3);
    ball(s * 5 * dir, 14 - up(s) * 2.5, 4.2, 4.2, legC, 1.5);
  } else { // de frente / espaldas: cada pierna se levanta por turnos
    ball(-5, 14 - up(s) * 3.2, 4, 4.3 - up(s) * 0.8, legC, 1.5);
    ball(5, 14 - up(-s) * 3.2, 4, 4.3 - up(-s) * 0.8, legC, 1.5);
  }
  ball(0, 6, 10, 9, bodyC, 2);
  if (bodyDetail) { ctx.save(); ell(0, 6, 10, 9); ctx.clip(); bodyDetail(); ctx.restore(); }
  if (side) ball(-s * 4.5 * dir, 6.5, 3.6, 4.6, armC, 1.2);

}

function drawChar(c, x, y, s, face, walk, shootT) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  bodyFace = face;
  shootPose = poseOverride !== null ? poseOverride : clamp(shootT / 8, 0, 1);
  c.body(walk);

function mkRoom(x, y, type) {

function draw() {
  // en el minijuego retro el mundo se dibuja en un lienzo aparte y luego se pixela
  const R8 = retro.on && (state === 'play' || state === 'dead');
  ctx = R8 ? retroSx : mainCtx;
  ctx.setTransform(R8 ? 1 : DPR, 0, 0, R8 ? 1 : DPR, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  if (state === 'title') { drawTitle(); drawPost(0.6); return; }
  if (state === 'menu') { drawMenu(); drawPost(0.45); drawUnlockToasts(); return; }
  if (state === 'select') { drawSelect(); drawPost(0.45); drawUnlockToasts(); return; }
  if (state === 'ending') { drawEnding(); drawPost(0.55); return; }
  if (ut && state === 'play') { utDraw(); return; }
  if (bal && state === 'play') { balDraw(); return; }
  if (fet && state === 'play') { fetDraw(); return; }
  if (dvl && state === 'play') { dvlDraw(); return; }
  ctx.save();
  if (shake) ctx.translate(rnd(-shake, shake), rnd(-shake, shake));
  drawRoom();
  drawDealFx();
  for (const k of cur.pickups) if (k.type === 'trapdoor') drawPickup(k);
  for (const h of hazards) drawHazard(h);
  const objs = [...cur.pickups.filter(k => k.type !== 'trapdoor').map(k => ({ y: k.y, f: () => {
      if (k.type === 'item' || k.type === 'pedestal') shaded(k.x, k.y - 20, 66, 30, () => drawPickup(k));
      else drawPickup(k);
    } })),
    ...enemies.map(e => ({ y: e.y + (e.boss && e.z > 0 ? 200 : 0), f: () => drawEnemyShaded(e) }))];
  if (state === 'play' || state === 'win' || state === 'dead') objs.push({ y: p.y, f: () => {
    const hurtAnim = p.hurtAt !== undefined && frame - p.hurtAt < 18;
    if (state !== 'dead' && !hurtAnim && p.inv > 0 && Math.floor(p.inv / 4) % 2) return;
    if (drawPlayerSprite()) { // animación del spritesheet
      if (p.shield > 0) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = `rgba(255,220,120,${0.45 + Math.sin(frame * 0.15) * 0.15})`; ctx.lineWidth = 2.5; ell(p.x, p.y - 12, 32, 36); ctx.stroke(); ctx.restore(); }
      if (p.star > 0) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; const g = ctx.createRadialGradient(p.x, p.y - 12, 5, p.x, p.y - 12, 42); g.addColorStop(0, `hsla(${frame * 12 % 360},100%,60%,.5)`); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(p.x - 45, p.y - 57, 90, 90); ctx.restore(); }
      return;
    }
    if (state === 'dead') return;
    if (p.star > 0) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(p.x, p.y - 12, 5, p.x, p.y - 12, 42);
      g.addColorStop(0, `hsla(${frame * 12 % 360},100%,60%,.5)`); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g; ctx.fillRect(p.x - 45, p.y - 57, 90, 90); ctx.restore();
    }
    drawCharShaded(p.char, p.x, p.y, 1, p.face, p.walk, p.shootT);
    if (p.shield > 0) { // burbuja del Escudo Divino
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = `rgba(255,220,120,${0.45 + Math.sin(frame * 0.15) * 0.15})`; ctx.lineWidth = 2.5;
      ell(p.x, p.y - 12, 32, 36); ctx.stroke(); ctx.restore();
    }
  } });
  objs.sort((a, b) => a.y - b.y).forEach(o => o.f());
  for (const t of tears) drawTear(t);
  for (const h of hazards) if (h.kind === 'beam') drawBeam(h);
  drawFxAnims();
  for (const q of particles) {
    ctx.globalAlpha = Math.min(1, q.life / 20);
    if (q.glow) ctx.globalCompositeOperation = 'lighter';
    if (q.ring) { ctx.strokeStyle = q.color; ctx.lineWidth = 5; ell(q.x, q.y, q.r, q.r * 0.7); ctx.stroke(); }
    else { ctx.fillStyle = q.color; ell(q.x, q.y, q.size / 2, q.size / 2); ctx.fill(); }

  ctx.restore();
  if (R8) { retroPost(); ctx = mainCtx; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }

  drawHUD();
  if (R8) drawRetroHUD();
  drawMsg();
  drawUnlockToasts();

  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#f2e6d0'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = 'bold 40px monospace';
    ctx.fillText('PAUSA', CX, CY);

  if (!retro.on && !deathCut && state === 'dead' && frame - (p.deathAt || 0) > 110) { // primero se ve la animación de muerte
    ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#e8d8c0'; ctx.font = '20px monospace';
    ctx.fillText(`${p.char.name} llegó a: ${floorName()}`, CX, 250);
    ctx.font = '15px monospace';
    ctx.fillText(`Objetos: ${p.items.length ? p.items.slice(-6).join(', ') : 'ninguno'}`, CX, 285);
    ctx.fillStyle = '#bfae94'; ctx.font = '18px monospace';
    ctx.fillText('ENTER: elegir personaje · R: reintentar', CX, 350);
  }
  if (state === 'win') {
    ctx.fillStyle = 'rgba(0,0,0,.75)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = `hsl(${frame * 3 % 360},90%,65%)`; ctx.font = 'bold 54px Georgia, serif'; ctx.fillText('¡VICTORIA!', CX, 140);

    ctx.fillStyle = '#bfae94'; ctx.font = '18px monospace';
    ctx.fillText('ENTER: seguir en modo infinito (más difícil) · R: menú', CX, 440);
  }
}

  const put = (dst, col, row, src = tmp, alpha = 1) => { dst.globalAlpha = alpha; dst.imageSmoothingQuality = 'high'; dst.drawImage(src, 0, 0, F * SS, F * SS, col * F, row * F, F, F); dst.globalAlpha = 1; };
  const body = (face, walk, shootT, o = {}) => { // el personaje con los pies en (80, 150)
    ctx.save(); ctx.translate(AX + (o.dx || 0), AY + (o.dy || 0));
    if (o.rot) { ctx.translate(0, 17 * S); ctx.rotate(o.rot); ctx.translate(0, -17 * S); }
    if (o.sy) { ctx.translate(0, 17 * S); ctx.scale(o.sx || 1, o.sy); ctx.translate(0, -17 * S); }
    poseOverride = o.pose === undefined ? null : o.pose; eyeMode = o.eyes || null;
    try { drawChar(c, 0, 0, S, face, walk, shootT); } finally { poseOverride = null; eyeMode = null; }
    ctx.restore();
  };
  const FACES = ['B', 'T', 'L', 'R'], DV = { B: [0, 1], T: [0, -1], L: [-1, 0], R: [1, 0] };
  const tearObj = (k, ang = 0) => ({ kind: c.tear || 'tear', x: 0, y: 0, r: 8, vx: Math.cos(ang) * 8, vy: Math.sin(ang) * 8, friendly: true,
    life: Math.round(9 * (1 - k)) + 1, maxLife: 10, spin: k * 6, ang, swing: 1, seed: 0, t: 0 });
  const tear = (x, y, k, ang, sc) => { ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc); drawTear(tearObj(k, ang)); ctx.restore(); };
  try {
    p = { ...newPlayer(c), char: c }; spriteExport = true; particles = [];
    // 1) movimiento
    const [mv, mx] = sheet(8, 8);
    FACES.forEach((f, r) => {
      for (let i = 0; i < 4; i++) {
        frame = 1000 + i * 10; const b = Math.sin(i / 4 * Math.PI * 2);
        draw(tx, () => body(f, 0, 0, { sy: 1 + b * 0.025, sx: 1 - b * 0.015 })); shadeCell(tx); put(mx, i, r);
      }
      for (let i = 0; i < 8; i++) {
        frame = 1000 + i * 5; const w = i / 8 * Math.PI * 2;
        draw(tx, () => body(f, w, 0, { dy: -Math.abs(Math.sin(w)) * 3 })); shadeCell(tx); put(mx, i, 4 + r);
      }
    });
    // 2) disparo: anticipación, disparo (cuadro 2), retroceso; luego el proyectil y su impacto
    const [sh, shc] = sheet(6, 6), ST = [-5, -2, 8, 6, 3, 1], KICK = [0, 0, 3, 2, 0, 0];
    FACES.forEach((f, r) => {
      const [dx, dy] = DV[f];
      for (let i = 0; i < 6; i++) {
        frame = 1000 + i * 4;
        draw(tx, () => body(f, 0, ST[i], { dx: -dx * KICK[i], dy: -dy * KICK[i] })); shadeCell(tx);
        if (i === 2 || i === 3) { // sale el disparo hacia donde mira
          draw(ax, () => tear(AX + dx * (34 + (i - 2) * 16), AY - 22 + dy * (30 + (i - 2) * 14), 0.1, Math.atan2(dy, dx), 1.6));
          layer(tx, aux, f === 'T');
        }
        put(shc, i, r);
      }
    });
    for (let i = 0; i < 4; i++) { frame = 1000 + i * 8; draw(tx, () => tear(80, 80, i / 4, 0, 2)); put(shc, i, 4); }
    const col = TEAR_COLOR[c.tear] || '#9fd3ff';
    for (let i = 0; i < 6; i++) {
      const k = i / 5;
      draw(tx, () => {
        ctx.globalAlpha = 1 - k * 0.9; ctx.strokeStyle = col; ctx.lineWidth = 4 * (1 - k) + 1;
        ell(80, 84, 10 + k * 34, (10 + k * 34) * 0.55); ctx.stroke();
        ctx.fillStyle = col;
        if (i < 2) { ell(80, 80, 12 * (1 - k * 2), 12 * (1 - k * 2)); ctx.fill(); }
        for (let j = 0; j < 8; j++) { const a = j / 8 * Math.PI * 2, rr = 3.5 * (1 - k) + 0.5; ell(80 + Math.cos(a) * (8 + k * 40), 80 + Math.sin(a) * (6 + k * 26) - Math.sin(k * Math.PI) * 10, rr, rr); ctx.fill(); }
        ctx.globalAlpha = 1;
      });
      put(shc, i, 5);
    }
    // 3) daño (destello blanco, rojo y vuelve a la normalidad) y muerte (cae, cierra los ojos y sube su alma)
    const [hu, hc] = sheet(10, 5), HT = [['#ffffff', 0.85], ['#ff2020', 0.55], ['#ff2020', 0.25], [null, 0]];
    FACES.forEach((f, r) => {
      for (let i = 0; i < 4; i++) {
        frame = 1000 + i * 4;
        draw(tx, () => body(f, 0, 6, { dx: [5, -4, 2, 0][i], pose: 1, sy: [0.9, 0.95, 1.02, 1][i], sx: [1.08, 1.04, 0.99, 1][i] }));
        shadeCell(tx, HT[i][0], HT[i][1]); put(hc, i, r);
      }
    });
    for (let i = 0; i < 10; i++) {
      frame = 1000 + i * 6; const fall = clamp((i - 1) / 4, 0, 1);
      draw(tx, () => body('B', 0, 0, { rot: -smooth(fall) * Math.PI / 2, dx: smooth(fall) * 62, dy: -smooth(fall) * 26, eyes: i >= 3 ? 'closed' : null, pose: i < 3 ? 1 : 0, sy: i === 0 ? 0.88 : 1, sx: i === 0 ? 1.1 : 1 }));
      shadeCell(tx, i < 2 ? '#ff2020' : null, i === 0 ? 0.55 : 0.3);
      put(hc, i, 4);
      if (i >= 6) {
        const k = (i - 6) / 3, up = 30 + k * 34;
        draw(ax, () => { body('B', 0, 0, { dy: -up, eyes: 'closed' }); ctx.strokeStyle = '#ffe680'; ctx.lineWidth = 2.5; ell(AX, AY - up - 44, 14, 4.5); ctx.stroke(); });
        ax.setTransform(SS, 0, 0, SS, 0, 0); ax.globalCompositeOperation = 'source-atop'; ax.fillStyle = 'rgba(235,245,255,.75)'; ax.fillRect(0, 0, F, F); ax.globalCompositeOperation = 'source-over';
        put(hc, i, 4, aux, 0.75 - k * 0.35);
      }
    }
    return { move: mv.toDataURL('image/png'), shoot: sh.toDataURL('image/png'), hurt: hu.toDataURL('image/png') };
  } finally { p = prevP; frame = prevFrame; particles = prevParticles; spriteExport = false; ctx = prevCtx; }
};
// ---------- Exportar música y sonidos a archivos (lo usa musica/exportar_audio.js) ----------
// Graba con el mismo sintetizador del juego, sin altavoces y más rápido que en tiempo real. Devuelve un WAV en base64.
window.exportarAudio = async (kind, name) => {
  const sr = 44100, m = kind === 'music' ? MUSIC[name] : null;
  let secs = 7, steps = 0, spb = 0;
  if (m) { spb = 60 / m.bpm / 4; const n = m.bass.length, loops = Math.max(2, Math.ceil(45 / (n * spb))); steps = n * loops; secs = steps * spb + 3; }
  const off = new OfflineAudioContext(2, Math.ceil(sr * secs), sr);
  const saved = [AC, master, sfxGain, musGain, noiseBuf];
  AC = off;
  master = off.createGain(); master.gain.value = 0.6; master.connect(off.destination);
  sfxGain = off.createGain(); sfxGain.gain.value = 0.8; sfxGain.connect(master);
  musGain = off.createGain(); musGain.gain.value = 0.3; musGain.connect(master);
  noiseBuf = off.createBuffer(1, sr, sr); const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  try {
    if (m) for (let i = 0; i < steps; i++) playStep(m, i % m.bass.length, 0.02 + i * spb);
    else SFX[name]();
  } finally { [AC, master, sfxGain, musGain, noiseBuf] = saved; }
  const buf = await off.startRendering(), ch = [buf.getChannelData(0), buf.getChannelData(1)];
  let peak = 0, end = 0;
  for (let i = 0; i < buf.length; i++) { const v = Math.max(Math.abs(ch[0][i]), Math.abs(ch[1][i])); if (v > peak) peak = v; if (v > 0.0005) end = i; }
  const len = m ? buf.length : Math.min(buf.length, end + Math.round(sr * 0.05)); // los sonidos se recortan donde terminan
  const gain = peak > 0 ? 0.9 / peak : 1; // volumen parejo entre archivos
  const wav = new DataView(new ArrayBuffer(44 + len * 4)), str = (o, s) => [...s].forEach((c, i) => wav.setUint8(o + i, c.charCodeAt(0)));
  str(0, 'RIFF'); wav.setUint32(4, 36 + len * 4, true); str(8, 'WAVEfmt '); wav.setUint32(16, 16, true); wav.setUint16(20, 1, true); wav.setUint16(22, 2, true);
  wav.setUint32(24, sr, true); wav.setUint32(28, sr * 4, true); wav.setUint16(32, 4, true); wav.setUint16(34, 16, true); str(36, 'data'); wav.setUint32(40, len * 4, true);
  for (let i = 0; i < len; i++) for (let c = 0; c < 2; c++) wav.setInt16(44 + i * 4 + c * 2, clamp(ch[c][i] * gain, -1, 1) * 32767, true);
  const bytes = new Uint8Array(wav.buffer);
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
};
window.grabarMuerte = async type => {


  grabando = true; initAudio(); if (AC.state !== 'running') await AC.resume();
  const wait = ms => new Promise(r => setTimeout(r, ms));
  selIdx = 0; startGame(); stopMusic(); msgT = 0;
  const b = mkEnemy(type, CX + 120, bossSpawnY(type, CY - 40)); b.spawn = 0; enemies = [b];
  p.x = CX - 160; p.y = CY + 60; p.face = 'R';
  await wait(700); // que termine el sonido de inicio
  const audio = AC.createMediaStreamDestination(); master.connect(audio);
  const stream = new MediaStream([...cv.captureStream(60).getVideoTracks(), ...audio.stream.getAudioTracks()]);
  const rec = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9,opus', videoBitsPerSecond: 10e6 });
  const parts = [], done = new Promise(r => rec.onstop = r);
  rec.ondataavailable = e => parts.push(e.data);
  rec.start(); await wait(300);
  p.inv = 0; p.shield = 0; p.star = 0; hurt(p.hp); // golpe final
  while (deathCut) await wait(50);
  await wait(2500); // un rato de la pantalla HAS MUERTO
  rec.stop(); await done; master.disconnect(audio);
  const buf = new Uint8Array(await new Blob(parts).arrayBuffer());
  let s = '';
  for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  return btoa(s);
};

let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
